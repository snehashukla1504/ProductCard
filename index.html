<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    background-color: #F2EAE2;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 30px;
}
.card{
    background-color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    border-radius:17px  ;
    overflow: hidden;
}
.product-photo{
    background-image: url("https://i.pinimg.com/564x/71/81/d0/7181d0922d847ad87329657072dadb02.jpg");
    background-size: cover;
    background-position: center;
    height: 430px;
    width: 300px;
    border-top-left-radius: 17px;
    border-bottom-left-radius: 17px;
}
.product-info{
    height: 430px;
    width: 300px;
    padding: 30px 20px;
    border-top-left-radius: 17px;
    border-bottom-left-radius: 17px;
}
.prod{
    font-family: "Montserrat", sans-serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 5px;
    color: #6C7289;
}
.name{
    font-family: "Fraunces", serif;
    font-weight: 700;
    font-size: 2rem;
    padding: 20px 0px;
    color: #1C232B;
}
.description{
    font-family: "Montserrat", sans-serif;
    font-weight: 500;
    font-size: 0.8rem;
    color: #6C7289;
}
.price{
    display: flex;
    margin: 30px 0px 30px 0px;
    /* justify-content: center; */
    align-items: center;
    gap: 20px;
}
.actual{
    font-size: 2rem;
    color: #3C8067;
    font-family: "Fraunces", serif;
    font-weight: 700;
}
.discount{
    font-family: "Montserrat", sans-serif;
    font-weight: 500;
    color: #6C7289;
    text-decoration: line-through;
    font-size: 0.8rem;
}
button{
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px 0px ;
    border-radius: 10px;
    border: none;
    background-color: #3C8067;
    color: #FFFFFF;
    gap: 7px;
}
@media (max-width:600px) {
    .card{
        max-width: 350px;
    }
    .product-photo{
        height: 350px ;
        width: 350px;
        border-radius: 0;
    }
    .product-info{
        width: 350px;
        height: 400px;
        padding: 30px;
    }
    body{
        padding-bottom:30px ;
    }
}
@media (max-width:500px) {
    .product-photo{
        height: 275px;
    }
}
@media (max-width:400px) {
    .product-info{
        height: 415px;
        padding: 20px;
    }
    
}
    </style>
</head>
<body>
    <div class="card">
        <div class="product-photo"></div>
        <div class="product-info">
            <p class="prod">PERFUME</p>
            <p class="name">Gabrielle Essence Eau De Parfum</p>
            <p class="description">
                 A radiant, solar, and voluptuous floral fragrance created by in-house perfumer Olivier Polge.
            </p>
            <div class="price">
                <p class="actual">$149.99</p>
                <p class="discount">$169.99</p>
            </div>
            <div>
            <button>
                <i class="fa-solid fa-cart-shopping"></i>
                <p>Add to cart</p>
            </button>
        </div>
        </div>    
    </div>
</body>
</html>
